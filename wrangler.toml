# Cloudflare Workers config. See README -> "Option A: Cloudflare Workers".
name = "hivecode"
main = "src/cloudflare.ts"
compatibility_date = "2026-06-01"

# Runs the vote timers and GitHub sync every minute.
[triggers]
crons = ["* * * * *"]

# THE ONLY LINE YOU EDIT: replace the placeholder with the database_id that
# `npx wrangler d1 create hivecode` printed. Keep the quotes.
[[d1_databases]]
binding = "DB"
database_name = "hivecode"
database_id = "PASTE-YOUR-DATABASE-ID-HERE"

# Everything else (Discord keys, GitHub token, repo, URL) is set with
# `npx wrangler secret put NAME`, so nothing private ever lives in this file.
